[project]
name = "chronos-verifier"
version = "0.1.0"
description = "Extracts time-sensitive claims, verifies them with Tavily, scores them."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # Long lines are allowed in docstrings and prompt strings, where breaking
  # them would hurt readability more than the length does.
  "E501",
  # Chronos deliberately catches broad exceptions on every degrade path: a
  # verification failure must never propagate into a gateway request.
  "BLE001",
  # Curly apostrophes and en dashes are not confusable typos here: the rule
  # patterns have to match the characters real web pages and model output
  # actually contain ("Twitter's logo", "Headline - Publisher").
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Prompt constants and rule tables read better unwrapped.
"chronos/rules.py" = ["E501"]
"chronos/extract.py" = ["E501"]
